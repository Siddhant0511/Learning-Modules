<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Lakes SQL - Interactive Guide</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- CodeMirror for SQL Editor -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/neo.min.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                    </svg>
                    <span>Great Lakes SQL</span>
                </div>
            </div>
            <nav class="module-nav" id="module-nav">
                <!-- Nav items generated via JS -->
            </nav>
        </aside>

        <main class="content-pane">
            <div class="content-scroll">
                <header class="content-header">
                    <div class="module-badge">Module <span id="module-number">1</span> of 14</div>
                    <h1 id="module-title">What is SQL?</h1>
                </header>
                <div class="content-body" id="module-content">
                    <!-- Content generated via JS -->
                </div>
                <footer class="content-footer">
                    <button class="nav-btn" id="prev-btn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        Previous
                    </button>
                    <button class="nav-btn primary" id="next-btn">
                        Next Module
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </footer>
            </div>
        </main>

        <aside class="editor-pane">
            <div class="editor-header">
                <div class="header-left">
                    <h2>Terminal</h2>
                    <div class="db-status">
                        <span class="status-dot" id="db-led"></span>
                        <span id="db-status-text">Booting DB...</span>
                    </div>
                </div>
                <button class="icon-btn" id="schema-btn" title="View Database Schema">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                </button>
            </div>
            
            <div class="editor-container">
                <textarea id="sql-editor"></textarea>
                <div class="editor-actions">
                    <button id="run-btn" class="run-btn primary">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        Run
                    </button>
                </div>
            </div>

            <div class="results-container">
                <div class="results-header">
                    <h3>Output</h3>
                    <span class="row-count" id="row-count"></span>
                </div>
                <div class="results-body" id="results-body">
                    <div class="placeholder-state">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                        <p>Write and run a query to view results.</p>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Modal for Schema -->
    <div class="modal-overlay" id="schema-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Database Schema</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <div class="modal-body" id="schema-body">
                <!-- Schema visualizer generated by JS -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/sql/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
