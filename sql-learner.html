<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Mastery — Interactive Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<style>
  :root {
    --cream: #FAFAF6;
    --cream2: #F2F0E8;
    --navy: #0E1628;
    --navy2: #1A2540;
    --navy3: #2D3A56;
    --amber: #E8962A;
    --amber-light: #FEF3DC;
    --amber-dark: #C4780A;
    --green: #2A7A4A;
    --green-light: #DCFCE7;
    --red: #C0392B;
    --red-light: #FEE2E2;
    --blue: #2563EB;
    --blue-light: #EFF6FF;
    --text: #1C1917;
    --text2: #57534E;
    --text3: #A8A29E;
    --border: #E2DDD5;
    --shadow: 0 2px 16px rgba(14,22,40,0.08);
    --shadow-lg: 0 8px 40px rgba(14,22,40,0.14);
    --radius: 10px;
    --sidebar-w: 270px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* SIDEBAR */
  #sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--navy);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 10;
  }

  #sidebar-header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .logo-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--amber);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .logo-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    color: #FFFFFF;
    line-height: 1.2;
  }

  .logo-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    margin-top: 4px;
  }

  /* Progress bar */
  #progress-wrap {
    padding: 16px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .progress-label {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  .progress-track {
    background: rgba(255,255,255,0.1);
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    background: var(--amber);
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* Module nav */
  #module-nav { padding: 12px 0 24px; flex: 1; }

  .nav-section-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
    padding: 8px 24px 4px;
    font-weight: 500;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
    position: relative;
  }

  .nav-item:hover { background: rgba(255,255,255,0.05); }
  .nav-item.active {
    background: rgba(232,150,42,0.12);
    border-left-color: var(--amber);
  }
  .nav-item.active .nav-num { color: var(--amber); }
  .nav-item.active .nav-label { color: #FFF; }

  .nav-item.done .nav-check { display: flex; }
  .nav-item.done .nav-num { display: none; }

  .nav-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }
  .nav-check {
    display: none;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    background: var(--green);
    border-radius: 50%;
    flex-shrink: 0;
    font-size: 10px;
    color: #fff;
  }
  .nav-label {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    font-weight: 400;
    line-height: 1.3;
  }
  .nav-badge {
    margin-left: auto;
    font-size: 9px;
    background: rgba(232,150,42,0.2);
    color: var(--amber);
    padding: 2px 6px;
    border-radius: 20px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* DB INFO */
  #db-info {
    margin: 12px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .db-info-title {
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .db-table-item {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    padding: 3px 0;
    cursor: pointer;
    transition: color 0.15s;
  }
  .db-table-item:hover { color: var(--amber); }
  .db-table-item span { color: rgba(255,255,255,0.25); }

  /* MAIN */
  #main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  /* TOP BAR */
  #topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .topbar-module {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--amber-dark);
    background: var(--amber-light);
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .topbar-title {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--navy);
  }
  .topbar-actions { margin-left: auto; display: flex; gap: 8px; }
  .btn-nav {
    background: var(--cream2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    color: var(--text2);
    transition: all 0.15s;
  }
  .btn-nav:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn-next {
    background: var(--navy);
    color: #fff;
    border: 1px solid var(--navy);
  }
  .btn-next:hover { background: var(--navy2); }

  /* CONTENT */
  #content-area {
    padding: 32px 40px 60px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  /* THEORY */
  .theory-block {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 32px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }

  .section-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--amber-dark);
    margin-bottom: 10px;
  }

  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 14px;
    line-height: 1.3;
  }

  .theory-text {
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--text2);
  }

  .theory-text p { margin-bottom: 12px; }
  .theory-text strong { color: var(--text); font-weight: 600; }
  .theory-text ul, .theory-text ol { padding-left: 20px; margin-bottom: 12px; }
  .theory-text li { margin-bottom: 6px; }
  .theory-text code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    background: var(--cream2);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--navy);
  }

  /* CONCEPT TABLE */
  .concept-table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 13.5px;
  }
  .concept-table th {
    background: var(--navy);
    color: #fff;
    padding: 10px 14px;
    text-align: left;
    font-weight: 500;
    font-size: 12px;
  }
  .concept-table th:first-child { border-radius: 6px 0 0 0; }
  .concept-table th:last-child { border-radius: 0 6px 0 0; }
  .concept-table td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text2);
    vertical-align: top;
  }
  .concept-table tr:nth-child(even) td { background: var(--cream); }
  .concept-table td code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    background: var(--cream2);
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--navy);
  }

  /* CALLOUT */
  .callout {
    border-left: 3px solid var(--amber);
    background: var(--amber-light);
    padding: 12px 16px;
    border-radius: 0 6px 6px 0;
    margin: 14px 0;
    font-size: 13.5px;
    color: var(--text);
  }
  .callout.tip { border-color: var(--blue); background: var(--blue-light); }
  .callout.warn { border-color: var(--red); background: var(--red-light); }
  .callout strong { display: block; margin-bottom: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--amber-dark); }
  .callout.tip strong { color: var(--blue); }
  .callout.warn strong { color: var(--red); }

  /* EXAMPLES */
  .examples-block {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 24px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .examples-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--cream);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .examples-header-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
  }
  .examples-list { padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--border); }
  .ex-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 6px 12px;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    color: var(--text2);
    transition: all 0.15s;
  }
  .ex-btn:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
  .ex-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* PLAYGROUND */
  #playground {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 24px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  #playground-header {
    background: var(--navy);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .playground-dots { display: flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-r { background: #FF5F57; }
  .dot-y { background: #FEBC2E; }
  .dot-g { background: #28C840; }

  .playground-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
  }

  #sql-editor {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    line-height: 1.7;
    background: #0F1C30;
    color: #A8D8A8;
    border: none;
    outline: none;
    width: 100%;
    min-height: 120px;
    padding: 20px 24px;
    resize: vertical;
    caret-color: var(--amber);
    letter-spacing: 0.01em;
    tab-size: 2;
  }

  #run-bar {
    background: #0F1C30;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #run-btn {
    background: var(--amber);
    color: var(--navy);
    border: none;
    padding: 8px 20px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #run-btn:hover { background: #F5A535; transform: translateY(-1px); }
  #run-btn:active { transform: translateY(0); }
  #clear-btn {
    background: transparent;
    color: rgba(255,255,255,0.4);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  #clear-btn:hover { color: rgba(255,255,255,0.8); border-color: rgba(255,255,255,0.3); }

  .run-hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    margin-left: auto;
  }

  /* RESULTS */
  #results-area { padding: 0; }

  #results-status {
    padding: 10px 20px;
    font-size: 12.5px;
    display: none;
    align-items: center;
    gap: 8px;
  }
  #results-status.success { background: var(--green-light); color: var(--green); display: flex; border-top: 1px solid #BBF7D0; }
  #results-status.error { background: var(--red-light); color: var(--red); display: flex; border-top: 1px solid #FECACA; }

  #results-table-wrap {
    overflow-x: auto;
    border-top: 1px solid var(--border);
    display: none;
  }

  #results-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  #results-table thead th {
    background: var(--cream2);
    padding: 9px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--navy3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-family: 'IBM Plex Mono', monospace;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  #results-table tbody td {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text2);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    white-space: nowrap;
  }
  #results-table tbody tr:hover td { background: var(--cream); }
  .null-val { color: var(--text3); font-style: italic; }
  .row-count {
    padding: 8px 16px;
    font-size: 11.5px;
    color: var(--text3);
    background: var(--cream);
    border-top: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* EXERCISES */
  .exercises-block {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }

  .exercises-header {
    background: var(--navy);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .exercises-header-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    color: #fff;
  }
  .exercises-header-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
  }

  .exercise-item {
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
  }
  .exercise-item:last-child { border-bottom: none; }

  .exercise-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .ex-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    background: var(--cream2);
    color: var(--text3);
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 500;
  }
  .ex-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--navy);
  }
  .ex-status {
    margin-left: auto;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .ex-status.pending { background: var(--cream2); color: var(--text3); }
  .ex-status.correct { background: var(--green-light); color: var(--green); }
  .ex-status.wrong { background: var(--red-light); color: var(--red); }

  .ex-desc {
    font-size: 13.5px;
    color: var(--text2);
    line-height: 1.6;
    margin-bottom: 12px;
  }

  .ex-hint-toggle {
    font-size: 12px;
    color: var(--amber-dark);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    margin-bottom: 8px;
    display: inline-block;
  }
  .ex-hint {
    display: none;
    background: var(--amber-light);
    border: 1px solid #F5D89A;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12.5px;
    color: var(--amber-dark);
    margin-bottom: 10px;
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1.6;
  }

  .ex-editor {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    line-height: 1.6;
    background: #0F1C30;
    color: #A8D8A8;
    border: none;
    outline: none;
    width: 100%;
    min-height: 70px;
    padding: 12px 16px;
    border-radius: 6px;
    resize: vertical;
    caret-color: var(--amber);
  }

  .ex-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }

  .ex-run-btn {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .ex-run-btn:hover { background: var(--navy2); }

  .ex-feedback {
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 6px;
    display: none;
  }
  .ex-feedback.correct { background: var(--green-light); color: var(--green); display: block; }
  .ex-feedback.wrong { background: var(--red-light); color: var(--red); display: block; }

  .ex-result-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 12px;
    display: none;
  }
  .ex-result-table th {
    background: var(--cream2);
    padding: 6px 12px;
    text-align: left;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--navy3);
    text-transform: uppercase;
    font-family: 'IBM Plex Mono', monospace;
    border-bottom: 1px solid var(--border);
  }
  .ex-result-table td {
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text2);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
  }
  .ex-result-table tr:nth-child(even) td { background: var(--cream); }

  /* SCHEMA VIEWER */
  .schema-block {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 24px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .schema-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--cream); }
  .schema-tab {
    padding: 10px 20px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--text3);
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    font-family: 'IBM Plex Mono', monospace;
  }
  .schema-tab.active { color: var(--navy); border-bottom-color: var(--amber); }
  .schema-content { display: none; padding: 16px 20px; overflow-x: auto; }
  .schema-content.active { display: block; }

  /* LOADING */
  #loading-screen {
    position: fixed; inset: 0; background: var(--navy);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; transition: opacity 0.5s ease;
  }
  .loading-logo {
    font-family: 'Fraunces', serif;
    font-size: 40px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
  }
  .loading-logo span { color: var(--amber); }
  .loading-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 32px;
  }
  .loading-bar-wrap { width: 240px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
  .loading-bar { height: 100%; background: var(--amber); border-radius: 2px; animation: loadpulse 1.8s ease-in-out infinite; }
  @keyframes loadpulse { 0%,100%{width:10%} 50%{width:90%} }
  .loading-msg { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.25); margin-top: 16px; }

  /* SYNTAX HIGHLIGHT COLORS for textarea */
  #sql-editor::selection { background: rgba(232,150,42,0.3); }

  /* JOIN DIAGRAM */
  .join-diagram {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 14px 0;
  }
  .join-card {

        <p>Every app you use daily runs on databases: Swiggy, LinkedIn, your bank's mobile app, Spotify. When you search for a restaurant or check your balance, a SQL query is running in the background.</p>

        <p>A <strong>relational database</strong> organizes data into tables with rows and columns. Tables are linked by shared columns (called keys). This avoids repetition — for example, instead of writing every student's full details in every enrollment record, we just store their <code>student_id</code>.</p>

let db = null;
let currentModule = 0;

async function initDB() {
  document.getElementById('loading-msg').textContent = 'Loading SQL engine (sql.js)...';
  const SQL = await initSqlJs({
    locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`
  });
  document.getElementById('loading-msg').textContent = 'Creating Great Lakes database...';
  db = new SQL.Database();
  db.run(DB_INIT_SQL);
  document.getElementById('loading-msg').textContent = 'Ready!';
  setTimeout(() => {
    const ls = document.getElementById('loading-screen');
    ls.style.opacity = '0';
    setTimeout(() => ls.style.display = 'none', 500);
  }, 400);
  buildSidebar();
  renderModule(0);
}

function resetDB() {
  db.run(`DROP TABLE IF EXISTS students; DROP TABLE IF EXISTS courses; DROP TABLE IF EXISTS enrollments; DROP TABLE IF EXISTS placements;`);
  db.run(DB_INIT_SQL);
  showStatus('success', '✓ Database reset to original state.');
}

// ===== QUERY EXECUTION =====
function runQuery(sql, targetResultEl, targetStatusEl) {
  if (!db) return null;
  sql = sql.trim();
  if (!sql) return null;
  try {
    const results = db.exec(sql);
    if (targetStatusEl) {
      const stmts = sql.split(';').filter(s => s.trim()).length;
      const msg = results.length > 0
        ? `✓ Query returned ${results[0].values.length} row${results[0].values.length !== 1 ? 's' : ''}`
        : `✓ ${stmts} statement${stmts > 1 ? 's' : ''} executed successfully`;
      showStatus('success', msg, targetStatusEl);
    }
    if (targetResultEl && results.length > 0) {
      renderTable(results[0], targetResultEl);
    } else if (targetResultEl) {
      targetResultEl.style.display = 'none';
      const rc = targetResultEl.nextElementSibling;
      if (rc && rc.classList.contains('row-count')) rc.textContent = '';
    }
    return results.length > 0 ? results[0] : null;
  } catch (e) {
    if (targetStatusEl) showStatus('error', '✗ ' + e.message, targetStatusEl);
    if (targetResultEl) targetResultEl.style.display = 'none';
    return null;
  }
}

function renderTable(result, containerEl) {
  containerEl.style.display = 'block';
  const { columns, values } = result;
  let html = '<table id="results-table"><thead><tr>';
  columns.forEach(c => html += `<th>${c}</th>`);
  html += '</tr></thead><tbody>';
  values.forEach(row => {
    html += '<tr>';
    row.forEach(v => html += `<td>${v === null ? '<span class="null-val">NULL</span>' : v}</td>`);
    html += '</tr>';
  });
  html += '</tbody></table>';
  html += `<div class="row-count">${values.length} row${values.length !== 1 ? 's' : ''} returned</div>`;
  containerEl.innerHTML = html;
}

function showStatus(type, msg, el) {
  const target = el || document.getElementById('results-status');
  if (!target) return;
  target.className = `${type}`;
  target.style.display = 'flex';
  target.textContent = msg;
}

// ===== SIDEBAR =====
function buildSidebar() {
  const nav = document.getElementById('module-nav');
  nav.innerHTML = '<div class="nav-section-title">Course Modules</div>';
  MODULES.forEach((m, i) => {
    const done = completedModules.has(i);
    const active = i === currentModule;
    nav.innerHTML += `
      <div class="nav-item ${active ? 'active' : ''} ${done ? 'done' : ''}" onclick="renderModule(${i})" id="nav-${i}">
        <div class="nav-num">${String(i+1).padStart(2,'0')}</div>
        <div class="nav-check">✓</div>
        <div class="nav-label">${m.title}</div>
        ${m.badge ? `<div class="nav-badge">${m.badge}</div>` : ''}
      </div>`;
  });
  updateProgress();
}

function updateProgress() {
  const pct = Math.round((completedModules.size / MODULES.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${completedModules.size} / ${MODULES.length}`;
}

// ===== RENDER MODULE =====
function renderModule(idx) {
  if (idx < 0 || idx >= MODULES.length) return;
  currentModule = idx;
  const m = MODULES[idx];

  // Update topbar
  document.getElementById('tb-module').textContent = `Module ${String(idx+1).padStart(2,'0')}`;
  document.getElementById('tb-title').textContent = m.title;

  // Update sidebar active states
  document.querySelectorAll('.nav-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  // Build content
  let html = '<div class="fade-in">';

  // Theory
  html += `<div class="theory-block">${m.theory}</div>`;

  // Examples
  if (m.examples && m.examples.length > 0) {
    html += `
      <div class="examples-block">
        <div class="examples-header">
          <span style="font-size:16px">💡</span>
          <span class="examples-header-title">Live Examples — Click to Load & Run</span>
        </div>
        <div class="examples-list">
          ${m.examples.map((e,i) => `<button class="ex-btn" onclick="loadExample(${i},'${escQ(e.sql)}')" id="exbtn-${i}">${e.label}</button>`).join('')}
        </div>
        <div id="playground">
          <div id="playground-header">
            <div class="playground-dots"><div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div></div>
            <div class="playground-label">SQL Playground — Edit & Run Anything</div>
          </div>
          <textarea id="sql-editor" spellcheck="false" placeholder="-- Write your SQL here\nSELECT * FROM students;">${m.examples[0].sql}</textarea>
          <div id="run-bar">
            <button id="run-btn" onclick="runPlayground()">▶ Run Query</button>
            <button id="clear-btn" onclick="document.getElementById('sql-editor').value=''">Clear</button>
            <button id="clear-btn" style="margin-left:4px" onclick="resetDB()">↺ Reset DB</button>
            <span class="run-hint">Ctrl+Enter</span>
          </div>
          <div id="results-status"></div>
          <div id="results-table-wrap"></div>
        </div>
      </div>`;
  }

  // Exercises
  if (m.exercises && m.exercises.length > 0) {
    html += `
      <div class="exercises-block">
        <div class="exercises-header">
          <span style="font-size:18px">🎯</span>
          <div class="exercises-header-title">Exercises</div>
          <div class="exercises-header-sub">${m.exercises.length} challenge${m.exercises.length>1?'s':''}</div>
        </div>`;

    m.exercises.forEach((ex, ei) => {
      html += `
        <div class="exercise-item" id="ex-item-${ei}">
          <div class="exercise-meta">
            <div class="ex-num">Challenge ${ei+1}</div>
            <div class="ex-title">${ex.title}</div>
            <div class="ex-status pending" id="ex-status-${ei}">Pending</div>
          </div>
          <div class="ex-desc">${ex.desc}</div>
          <div class="ex-hint-toggle" onclick="toggleHint(${ei})">💡 Show hint</div>
          <div class="ex-hint" id="ex-hint-${ei}">${ex.hint}</div>
          <textarea class="ex-editor" id="ex-editor-${ei}" spellcheck="false" placeholder="-- Write your answer here"></textarea>
          <div class="ex-actions">
            <button class="ex-run-btn" onclick="checkExercise(${idx},${ei})">Check Answer</button>
            <div class="ex-feedback" id="ex-feedback-${ei}"></div>
          </div>
          <table class="ex-result-table" id="ex-result-${ei}"></table>
        </div>`;
    });

    html += '</div>';
  }

  html += '</div>';
  document.getElementById('content-area').innerHTML = html;
  document.getElementById('main').scrollTop = 0;

  // Keyboard shortcut
  setTimeout(() => {
    const ed = document.getElementById('sql-editor');
    if (ed) {
      ed.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runPlayground(); }
        if (e.key === 'Tab') { e.preventDefault(); const s=ed.selectionStart,end=ed.selectionEnd; ed.value=ed.value.substring(0,s)+'  '+ed.value.substring(end); ed.selectionStart=ed.selectionEnd=s+2; }
      });
    }
  }, 100);
}

function escQ(sql) {
  return sql.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');
}

function loadExample(i, sqlEncoded) {
  const sql = sqlEncoded.replace(/\\n/g, '\n').replace(/\\'/g, "'");
  const ed = document.getElementById('sql-editor');
  if (ed) {
    ed.value = sql;
    document.querySelectorAll('.ex-btn').forEach((b,bi) => b.classList.toggle('active', bi===i));
    runPlayground();
    ed.focus();
  }
}

function runPlayground() {
  const ed = document.getElementById('sql-editor');
  if (!ed) return;
  const sql = ed.value.trim();
  if (!sql) return;
  const statusEl = document.getElementById('results-status');
  const tableEl = document.getElementById('results-table-wrap');
  statusEl.className = '';
  statusEl.style.display = 'none';
  tableEl.style.display = 'none';
  tableEl.innerHTML = '';
  runQuery(sql, tableEl, statusEl);
}

function toggleHint(i) {
  const h = document.getElementById(`ex-hint-${i}`);
  if (h) h.style.display = h.style.display === 'block' ? 'none' : 'block';
}

function checkExercise(modIdx, exIdx) {
  const m = MODULES[modIdx];
  const ex = m.exercises[exIdx];
  const sql = document.getElementById(`ex-editor-${exIdx}`).value.trim();
  const feedbackEl = document.getElementById(`ex-feedback-${exIdx}`);
  const statusEl = document.getElementById(`ex-status-${exIdx}`);
  const resultTable = document.getElementById(`ex-result-${exIdx}`);

  if (!sql) {
    feedbackEl.className = 'ex-feedback wrong';
    feedbackEl.textContent = 'Please write a query first.';
    return;
  }

  try {
    const results = db.exec(sql);
    const rows = results.length > 0 ? results[0].values.map(row => {
      const obj = {};
      results[0].columns.forEach((c,i) => obj[c] = row[i]);
      return obj;
    }) : [];
    const cols = results.length > 0 ? results[0].columns : [];

    const passed = ex.validate(rows, cols);

    if (passed) {
      feedbackEl.className = 'ex-feedback correct';
      feedbackEl.textContent = '✓ Correct! ' + (ex.exp || '');
      statusEl.className = 'ex-status correct';
      statusEl.textContent = '✓ Solved';
      completedModules.add(modIdx);
      buildSidebar();
      document.getElementById(`nav-${modIdx}`).classList.add('active');
    } else {
      feedbackEl.className = 'ex-feedback wrong';
      feedbackEl.textContent = '✗ Not quite. Expected: ' + ex.exp;
      statusEl.className = 'ex-status wrong';
      statusEl.textContent = '✗ Try again';
    }

    // Show result
    if (results.length > 0) {
      resultTable.style.display = 'table';
      const { columns, values } = results[0];
      let thtml = '<thead><tr>' + columns.map(c=>`<th>${c}</th>`).join('') + '</tr></thead><tbody>';
      values.slice(0,8).forEach(row => {
        thtml += '<tr>' + row.map(v=>`<td>${v===null?'<em>NULL</em>':v}</td>`).join('') + '</tr>';
      });
      if (values.length > 8) thtml += `<tr><td colspan="${columns.length}" style="color:var(--text3);font-style:italic">...${values.length-8} more rows</td></tr>`;
      thtml += '</tbody>';
      resultTable.innerHTML = thtml;
    }

  } catch(e) {
    feedbackEl.className = 'ex-feedback wrong';
    feedbackEl.textContent = '✗ SQL Error: ' + e.message;
    statusEl.className = 'ex-status wrong';
    statusEl.textContent = 'Error';
    resultTable.style.display = 'none';
  }

  feedbackEl.style.display = 'block';
}

function navigate(dir) {
  renderModule(Math.max(0, Math.min(MODULES.length-1, currentModule + dir)));
}

function loadTablePreview(tableName) {
  const ed = document.getElementById('sql-editor');
  if (ed) {
    ed.value = `SELECT * FROM ${tableName};`;
    runPlayground();
  } else {
    // Switch to module 0 and show
    renderModule(0);
    setTimeout(() => {
      const ed2 = document.getElementById('sql-editor');
      if (ed2) { ed2.value = `SELECT * FROM ${tableName};`; runPlayground(); }
    }, 200);
  }
}

// ===== INIT =====
initDB().catch(e => {
  document.getElementById('loading-msg').textContent = 'Error: ' + e.message;
  console.error(e);
});
</script>
